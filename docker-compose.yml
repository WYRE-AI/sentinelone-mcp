services:
  # Gateway mode. The SentinelOne API token and console URL arrive per request
  # on X-S1-API-Token and X-S1-Console-URL. Do not set PURPLEMCP_CONSOLE_TOKEN,
  # PURPLEMCP_CONSOLE_BASE_URL, or env_file here — that would put static vendor
  # credentials in the container. The project .env is used only for Compose
  # interpolation of CONDUIT_S2S_SECRET.
  sentinelone-mcp:
    build: .
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      - PORT=8080
      - MCP_HTTP_HOST=0.0.0.0
      - CONDUIT_S2S_SECRET=${CONDUIT_S2S_SECRET:?set CONDUIT_S2S_SECRET}
      - LOG_LEVEL=${LOG_LEVEL:-info}
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
